name: pipeline

# PRs run every gate. Pushes to main run every gate, then deploy (after a manual approval).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; jobs that need more ask for it explicitly.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: secure-ml-inference
  # Same pinned Trivy as scripts/image_report.sh. We run the image directly instead of
  # aquasecurity/trivy-action, whose tags were hijacked in the March 2026 supply-chain attack.
  TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install --require-hashes --no-deps -r requirements-dev.txt
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  test:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: pytest (unit + real-model integration)
        run: python -m pytest --cov --cov-report=term-missing --cov-fail-under=90

  security:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install --require-hashes --no-deps -r requirements-dev.txt
      - name: Bandit (code scan, fail on HIGH)
        run: bandit -c pyproject.toml -r app --severity-level high
      - name: pip-audit (dependency scan, fail on any known vulnerability)
        run: bash scripts/audit_deps.sh requirements.txt
      # Built-in checks plus the project's own policies/ (SMI-0001: no public ingress except 80/443,
      # a gap in Trivy's built-in AWS-0107, which only covers ports 22/3389).
      - name: Trivy config (IaC scan, fail on HIGH/CRITICAL misconfigurations)
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src "$TRIVY_IMAGE" config \
            --severity HIGH,CRITICAL --exit-code 1 --ignorefile .trivyignore \
            --config-check policies --check-namespaces user infra/

  build-scan:
    needs: [test, security]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # upload SARIF to GitHub code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -f docker/Dockerfile -t "$IMAGE_NAME:$GITHUB_SHA" .
      # Run the image the way ECS Fargate will. ECS mounts the task's /tmp volume as root:root 0755
      # unless the image declares VOLUME /tmp (then it copies the image's /tmp ownership), and
      # torch needs a writable temp dir at import. This step exists because that exact failure
      # first surfaced in production (exit code 3 on startup).
      - name: Container smoke test (ECS-like runtime)
        run: |
          img="$IMAGE_NAME:$GITHUB_SHA"
          docker image inspect "$img" --format '{{json .Config.Volumes}}' | grep -q '"/tmp"' \
            || { echo "::error::image must declare VOLUME /tmp (ECS would mount it root-owned 0755)"; exit 1; }
          owner=$(docker run --rm --entrypoint stat "$img" -c '%u' /tmp)
          [ "$owner" = "10001" ] || { echo "::error::/tmp must be owned by uid 10001, got $owner"; exit 1; }
          docker run -d --name smoke -p 8000:8000 -e API_KEY=ci-smoke-test-key-0123456789 \
            --read-only --mount type=volume,dst=/tmp --cap-drop ALL \
            --security-opt no-new-privileges:true "$img"
          for _ in $(seq 1 30); do
            if curl -fsS localhost:8000/health; then docker rm -f smoke >/dev/null; exit 0; fi
            sleep 2
          done
          docker logs smoke
          exit 1
      - name: "Trivy image scan (gate: fail on fixable HIGH/CRITICAL)"
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --timeout 20m "$IMAGE_NAME:$GITHUB_SHA"
      - name: Trivy SARIF report (all HIGH/CRITICAL, including unfixed, for visibility)
        if: always()
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" \
            "$TRIVY_IMAGE" image --scanners vuln --severity HIGH,CRITICAL --format sarif \
            --output /out/trivy-image.sarif --timeout 20m "$IMAGE_NAME:$GITHUB_SHA"
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && hashFiles('trivy-image.sarif') != ''
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: SBOM (CycloneDX)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" \
            "$TRIVY_IMAGE" image --format cyclonedx --output /out/sbom.cdx.json \
            "$IMAGE_NAME:$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 90
      # Deploy exactly the image that was scanned, rather than rebuilding it in the deploy job.
      - name: Save scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save "$IMAGE_NAME:$GITHUB_SHA" | gzip -1 > image.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: image-${{ github.sha }}
          path: image.tar.gz
          retention-days: 1
          compression-level: 0 # already gzipped

  deploy:
    needs: build-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # The "production" environment has a required reviewer, so this job waits for approval.
    # The AWS role's trust policy only accepts OIDC tokens from this environment.
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      id-token: write # request the GitHub OIDC token that is exchanged for short-lived AWS creds
    # Repo variables are passed through env and referenced as $VAR, never inlined into scripts
    # with ${{ }}, which rules out template injection.
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
      ECS_TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: Record start time
        run: echo "DEPLOY_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-${{ github.sha }}
      - run: gunzip -c image.tar.gz | docker load
      - name: Get short-lived AWS credentials via OIDC (no stored keys)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 900
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: Push image to ECR (immutable tag = commit SHA)
        run: |
          docker tag "$IMAGE_NAME:$GITHUB_SHA" "$ECR_REPOSITORY_URL:$GITHUB_SHA"
          docker push "$ECR_REPOSITORY_URL:$GITHUB_SHA"
      - name: Fetch current task definition
        run: |
          aws ecs describe-task-definition --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition > task-def.json
      - id: render
        uses: aws-actions/amazon-ecs-render-task-definition@138c24f321fdbdf7edee4a685519d253cae2cdea # v1.9.0
        with:
          task-definition: task-def.json
          container-name: ${{ vars.ECS_CONTAINER_NAME }}
          image: ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}
      - name: Deploy to ECS and wait until the service is stable
        uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de # v2.6.3
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars.ECS_SERVICE }}
          # Terraform creates the service at 0 tasks (ECR is empty then); deploys run 1.
          desired-count: 1
          wait-for-service-stability: true
          wait-for-minutes: 15
      - name: Smoke test through the ALB
        run: |
          for _ in $(seq 1 10); do
            curl -fsS "$APP_URL/health" && exit 0
            sleep 6
          done
          exit 1
      - name: Deploy time summary
        if: always()
        run: |
          secs=$(( $(date +%s) - DEPLOY_START ))
          {
            echo "### Deploy"
            echo "Image: \`$ECR_REPOSITORY_URL:$GITHUB_SHA\`"
            echo "Approval -> stable service: **${secs}s**"
          } >> "$GITHUB_STEP_SUMMARY"
